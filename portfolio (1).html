<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio | StartupBae</title>
<style>
  :root {
    --bg: #faf8f5;
    --text: #25252a;
    --muted: #77757a;
    --line: #dcd8d2;
    --placeholder: #ebe7e1;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  .page { max-width: 1320px; margin: 0 auto; padding: 28px 32px 80px; }

  /* Back link */
  .back { font-size: 15px; color: var(--muted); }
  .back:hover { color: var(--text); }

  /* Category navigation */
  .filters {
    display: flex; gap: 28px;
    margin: 36px 0 44px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filters button {
    flex: none;
    padding: 0 0 14px;
    font-size: 15px;
    color: var(--muted);
    border-bottom: 1px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
  }
  .filters button:hover { color: var(--text); }
  .filters button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--text); }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px 32px; }
  .card { display: block; width: 100%; text-align: left; }
  .thumb {
    position: relative; aspect-ratio: 4 / 3; overflow: hidden;
    background: var(--placeholder);
  }
  .thumb img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .5s ease;
  }
  .thumb::after {
    content: ""; position: absolute; inset: 0;
    background: rgba(0, 0, 0, .18); opacity: 0; transition: opacity .3s ease;
  }
  .card:hover .thumb img, .card:focus-visible .thumb img { transform: scale(1.03); }
  .card:hover .thumb::after, .card:focus-visible .thumb::after { opacity: 1; }
  .thumb .missing {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px;
  }
  .play {
    position: absolute; left: 50%; top: 50%; z-index: 1;
    width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%; background: rgba(255, 255, 255, .92);
    display: flex; align-items: center; justify-content: center;
  }
  .play svg { width: 18px; height: 18px; margin-left: 3px; fill: var(--text); }
  .meta { padding-top: 14px; }
  .meta h2 { margin: 0; font-size: 16px; font-weight: 500; }
  .meta p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
  .empty { color: var(--muted); grid-column: 1 / -1; }

  /* Lightbox */
  dialog.lightbox {
    position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none;
    margin: 0; padding: 0; border: 0;
    background: rgba(250, 248, 245, .98); color: var(--text);
  }
  dialog.lightbox[open] { display: flex; flex-direction: column; }
  dialog.lightbox::backdrop { background: rgba(250, 248, 245, .98); }
  .lb-top { display: flex; justify-content: flex-end; padding: 14px 20px 0; }
  .lb-close { font-size: 15px; padding: 8px 4px; }
  .lb-stage {
    flex: 1; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 8px 64px;
  }
  .lb-media { max-width: 100%; max-height: 100%; display: flex; align-items: center; justify-content: center; }
  .lb-media img, .lb-media video { max-width: 100%; max-height: 100%; display: block; object-fit: contain; }
  .lb-media iframe { width: min(100%, 1100px); aspect-ratio: 16 / 9; height: auto; max-height: 100%; border: 0; background: #000; }
  .lb-missing { padding: 80px 40px; background: var(--placeholder); color: var(--muted); font-size: 14px; }
  .lb-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; font-size: 26px; line-height: 1; color: var(--muted);
  }
  .lb-arrow:hover { color: var(--text); }
  .lb-arrow.prev { left: 8px; }
  .lb-arrow.next { right: 8px; }
  .lb-bottom {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 20px;
    padding: 14px 24px 22px; border-top: 1px solid var(--line);
  }
  .lb-info h3 { margin: 0; font-size: 16px; font-weight: 500; }
  .lb-info p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
  .lb-nav { display: flex; gap: 24px; font-size: 15px; flex: none; }
  .lb-nav button { color: var(--muted); padding: 8px 0; }
  .lb-nav button:hover { color: var(--text); }

  /* Tablet */
  @media (max-width: 960px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 40px 24px; }
  }
  /* Mobile */
  @media (max-width: 600px) {
    .page { padding: 20px 18px 56px; }
    .grid { grid-template-columns: 1fr; gap: 36px; }
    .filters { gap: 22px; margin: 28px -18px 32px; padding: 0 18px; }
    .lb-stage { padding: 4px 0; }
    .lb-arrow { background: rgba(250, 248, 245, .85); width: 40px; height: 40px; }
    .lb-arrow.prev { left: 4px; }
    .lb-arrow.next { right: 4px; }
    .lb-bottom { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 18px 18px; }
    .lb-nav { justify-content: space-between; }
  }
  @media (prefers-reduced-motion: reduce) {
    .thumb img, .thumb::after { transition: none; }
  }
</style>
</head>
<body>

<main class="page">
  <button class="back" type="button" onclick="history.back()">← Back</button>

  <nav class="filters" id="filters" aria-label="Portfolio categories"></nav>

  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<!-- Lightbox -->
<dialog class="lightbox" id="lightbox" aria-label="Project viewer">
  <div class="lb-top">
    <button class="lb-close" id="lbClose" type="button">Close</button>
  </div>
  <div class="lb-stage" id="lbStage">
    <button class="lb-arrow prev" id="imgPrev" type="button" aria-label="Previous image">‹</button>
    <div class="lb-media" id="lbMedia"></div>
    <button class="lb-arrow next" id="imgNext" type="button" aria-label="Next image">›</button>
  </div>
  <div class="lb-bottom">
    <div class="lb-info">
      <h3 id="lbTitle"></h3>
      <p id="lbMeta"></p>
    </div>
    <div class="lb-nav">
      <button id="projPrev" type="button">← Previous project</button>
      <button id="projNext" type="button">Next project →</button>
    </div>
  </div>
</dialog>

<script>
/* =====================================================================
   PORTFOLIO DATA — EDIT THIS SECTION
   ---------------------------------------------------------------------
   HOW TO ADD A NEW PROJECT
     Copy one whole block { ... }, paste it below the last one
     (keep the comma between blocks), then change the details.

   HOW TO CHANGE AN IMAGE
     Put the new image in the "portfolio" folder, then change the file
     name in "thumbnail" (the picture on the grid) and in "images"
     (the pictures in the lightbox).

   HOW TO CHANGE A TITLE
     Change the text inside the quotes after  title:

   HOW TO ADD MULTIPLE IMAGES
     Add more file paths to the "images" list, separated by commas:
       images: ["portfolio/a.jpg", "portfolio/b.jpg", "portfolio/c.jpg"]

   HOW TO ADD A VIDEO
     Set  type: "video"  and add a  video:  line with a link:
       video: "https://www.youtube.com/watch?v=XXXXXXXXXXX"
       video: "https://vimeo.com/123456789"
       video: "https://example.com/my-film.mp4"
     Keep "thumbnail" as the cover picture. A video does not need "images".
     Tip: upload videos to YouTube or Vimeo, so you never have to put
     large files on GitHub. (YouTube may refuse to play when this page is
     opened straight from your computer. It works once the page is online.)

   HOW TO CHANGE A CATEGORY
     Change  category:  to one of the names in the "categories" list below.
     The text must match exactly.
   ===================================================================== */

const categories = [
  "Branding & Logos",
  "Websites & Landing Pages",
  "Social Media & Ads",
  "2D & 3D Animation",
  "Motion Graphics & Videos",
  "Pitch Decks & Presentations",
  "Brochures & Marketing Materials",
  "UI/UX Design"
];

const portfolioItems = [
  {
    title: "Brand Identity — Project 01",
    category: "Branding & Logos",
    year: "2026",
    type: "image",
    thumbnail: "portfolio/branding-01.jpg",
    images: ["portfolio/branding-01.jpg", "portfolio/branding-02.jpg"]
  },
  {
    title: "Brand Identity — Project 02",
    category: "Branding & Logos",
    year: "2026",
    type: "image",
    thumbnail: "portfolio/branding-02.jpg",
    images: ["portfolio/branding-02.jpg"]
  },
  {
    title: "Website Design — Project 01",
    category: "Websites & Landing Pages",
    year: "2026",
    type: "image",
    thumbnail: "portfolio/website-01.jpg",
    images: ["portfolio/website-01.jpg"]
  },
  {
    title: "Landing Page — Project 01",
    category: "Websites & Landing Pages",
    year: "2026",
    type: "image",
    thumbnail: "portfolio/website-02.jpg",
    images: ["portfolio/website-02.jpg"]
  },
  {
    title: "Social Media Campaign — Project 01",
    category: "Social Media & Ads",
    year: "2026",
    type: "image",
    thumbnail: "portfolio/social-01.jpg",
    images: ["portfolio/social-01.jpg", "portfolio/social-02.jpg"]
  },
  {
    title: "Ad Creative — Project 01",
    category: "Social Media & Ads",
    year: "2026",
    type: "image",
    thumbnail: "portfolio/social-02.jpg",
    images: ["portfolio/social-02.jpg"]
  },
  {
    title: "2D Animation — Project 01",
    category: "2D & 3D Animation",
    year: "2026",
    type: "image",
    thumbnail: "portfolio/animation-01.jpg",
    images: ["portfolio/animation-01.jpg"]
  },
  {
    title: "3D Animation — Project 01",
    category: "2D & 3D Animation",
    year: "2026",
    type: "image",
    thumbnail: "portfolio/animation-02.jpg",
    images: ["portfolio/animation-02.jpg"]
  },
  {
    // VIDEO EXAMPLE — replace the link below with your own YouTube, Vimeo or .mp4 link
    title: "Motion Graphics — Project 01",
    category: "Motion Graphics & Videos",
    year: "2026",
    type: "video",
    thumbnail: "portfolio/motion-01.jpg",
    video: "https://www.youtube.com/watch?v=REPLACE_WITH_VIDEO_ID"
  },
  {
    // VIDEO EXAMPLE — replace the link below with your own YouTube, Vimeo or .mp4 link
    title: "Video — Project 01",
    category: "Motion Graphics & Videos",
    year: "2026",
    type: "video",
    thumbnail: "portfolio/motion-02.jpg",
    video: "https://vimeo.com/REPLACE_WITH_VIDEO_ID"
  },
  {
    title: "Pitch Deck — Project 01",
    category: "Pitch Decks & Presentations",
    year: "2026",
    type: "image",
    thumbnail: "portfolio/deck-01.jpg",
    images: ["portfolio/deck-01.jpg", "portfolio/deck-02.jpg"]
  },
  {
    title: "Presentation — Project 01",
    category: "Pitch Decks & Presentations",
    year: "2026",
    type: "image",
    thumbnail: "portfolio/deck-02.jpg",
    images: ["portfolio/deck-02.jpg"]
  },
  {
    title: "Brochure Design — Project 01",
    category: "Brochures & Marketing Materials",
    year: "2026",
    type: "image",
    thumbnail: "portfolio/brochure-01.jpg",
    images: ["portfolio/brochure-01.jpg"]
  },
  {
    title: "Marketing Material — Project 01",
    category: "Brochures & Marketing Materials",
    year: "2026",
    type: "image",
    thumbnail: "portfolio/brochure-02.jpg",
    images: ["portfolio/brochure-02.jpg"]
  },
  {
    title: "UI/UX Design — Project 01",
    category: "UI/UX Design",
    year: "2026",
    type: "image",
    thumbnail: "portfolio/uiux-01.jpg",
    images: ["portfolio/uiux-01.jpg"]
  }
];

/* =====================================================================
   END OF EDITABLE SECTION — you do not need to change anything below
   ===================================================================== */

const filtersEl = document.getElementById("filters");
const gridEl = document.getElementById("grid");
const box = document.getElementById("lightbox");
const mediaEl = document.getElementById("lbMedia");
const imgPrev = document.getElementById("imgPrev");
const imgNext = document.getElementById("imgNext");

let activeCategory = "All";
let visible = [];      // projects currently shown in the grid
let current = 0;       // index in "visible" of the open project
let imageIndex = 0;    // which image of that project is showing
let opener = null;     // button that opened the lightbox

function esc(text) {
  const d = document.createElement("div");
  d.textContent = text == null ? "" : text;
  return d.innerHTML;
}

/* ---------- Category navigation ---------- */
function buildFilters() {
  filtersEl.innerHTML = ["All"].concat(categories).map(function (name) {
    return '<button type="button" aria-pressed="' + (name === activeCategory) + '" data-cat="' + esc(name) + '">' + esc(name) + "</button>";
  }).join("");
}
filtersEl.addEventListener("click", function (e) {
  const btn = e.target.closest("button");
  if (!btn) return;
  activeCategory = btn.dataset.cat;
  buildFilters();
  buildGrid();
});

/* ---------- Grid ---------- */
function buildGrid() {
  visible = portfolioItems.filter(function (p) {
    return activeCategory === "All" || p.category === activeCategory;
  });
  if (!visible.length) {
    gridEl.innerHTML = '<p class="empty">No projects in this category yet.</p>';
    return;
  }
  gridEl.innerHTML = visible.map(function (p, i) {
    const label = p.type === "video" ? "Play video: " + p.title : "View project: " + p.title;
    const play = p.type === "video"
      ? '<span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></svg></span>' : "";
    return '<button class="card" type="button" data-i="' + i + '" aria-label="' + esc(label) + '">' +
      '<div class="thumb">' +
        '<img src="' + esc(p.thumbnail) + '" alt="' + esc(p.title + " — " + p.category) + '" loading="lazy">' +
        play +
      "</div>" +
      '<div class="meta"><h2>' + esc(p.title) + "</h2><p>" + esc(p.category) + (p.year ? ", " + esc(p.year) : "") + "</p></div>" +
    "</button>";
  }).join("");

  // If an image file is missing, show a neutral placeholder instead
  gridEl.querySelectorAll(".thumb img").forEach(function (img) {
    img.addEventListener("error", function () {
      img.style.display = "none";
      const note = document.createElement("span");
      note.className = "missing";
      note.textContent = "Image coming soon";
      img.parentNode.insertBefore(note, img);
    });
  });
}
gridEl.addEventListener("click", function (e) {
  const card = e.target.closest(".card");
  if (!card) return;
  opener = card;
  openProject(Number(card.dataset.i), 0);
});

/* ---------- YouTube / Vimeo / MP4 ---------- */
function videoEmbed(url) {
  let m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  if (m) return '<iframe src="https://www.youtube.com/embed/' + m[1] + '?rel=0" title="Video player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return '<iframe src="https://player.vimeo.com/video/' + m[1] + '" title="Video player" allow="autoplay; picture-in-picture; fullscreen" allowfullscreen></iframe>';
  return '<video src="' + esc(url) + '" controls playsinline autoplay></video>';
}

/* ---------- Lightbox ---------- */
function openProject(i, imgIdx) {
  current = i;
  imageIndex = imgIdx || 0;
  const p = visible[current];

  mediaEl.innerHTML = "";
  if (p.type === "video") {
    mediaEl.innerHTML = videoEmbed(p.video || "");
  } else {
    const list = p.images && p.images.length ? p.images : [p.thumbnail];
    const img = new Image();
    img.src = list[imageIndex];
    img.alt = p.title + (list.length > 1 ? " — image " + (imageIndex + 1) + " of " + list.length : "");
    img.addEventListener("error", function () {
      mediaEl.innerHTML = '<div class="lb-missing">Image coming soon</div>';
    });
    mediaEl.appendChild(img);
  }

  document.getElementById("lbTitle").textContent = p.title;
  const count = p.type !== "video" && p.images && p.images.length > 1
    ? " — image " + (imageIndex + 1) + " of " + p.images.length : "";
  document.getElementById("lbMeta").textContent = p.category + (p.year ? ", " + p.year : "") + count;

  const multi = p.type !== "video" && p.images && p.images.length > 1;
  imgPrev.hidden = imgNext.hidden = !multi;

  if (!box.open) {
    document.body.style.overflow = "hidden";   // keeps the page where it is
    box.showModal();
  }
}

function step(dir) {
  const p = visible[current];
  const total = p.type !== "video" && p.images ? p.images.length : 1;
  const next = imageIndex + dir;
  if (total > 1 && next >= 0 && next < total) {
    openProject(current, next);
  } else {
    changeProject(dir);
  }
}

function changeProject(dir) {
  const n = (current + dir + visible.length) % visible.length;
  const target = visible[n];
  const last = target.type !== "video" && target.images ? target.images.length - 1 : 0;
  openProject(n, dir < 0 ? last : 0);
}

function closeBox() {
  if (box.open) box.close();
}
box.addEventListener("close", function () {
  mediaEl.innerHTML = "";                 // stops any playing video
  document.body.style.overflow = "";
  if (opener) opener.focus({ preventScroll: true });
});

document.getElementById("lbClose").addEventListener("click", closeBox);
imgPrev.addEventListener("click", function () { step(-1); });
imgNext.addEventListener("click", function () { step(1); });
document.getElementById("projPrev").addEventListener("click", function () { changeProject(-1); });
document.getElementById("projNext").addEventListener("click", function () { changeProject(1); });

// Click outside the picture/video (on empty space) closes the lightbox
box.addEventListener("click", function (e) {
  if (e.target === box || e.target.id === "lbStage" || e.target.id === "lbMedia") closeBox();
});

// Keyboard: Escape is handled by the browser; arrows move left/right
document.addEventListener("keydown", function (e) {
  if (!box.open) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
});

buildFilters();
buildGrid();
</script>
</body>
</html>
